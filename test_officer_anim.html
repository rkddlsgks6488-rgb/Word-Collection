<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Sprite Row & Animation Tester</title>
    <style>
        body { background: #1a1a1a; color: #fff; font-family: sans-serif; padding: 20px; }
        .row-box { margin-bottom: 30px; background: #2a2a2a; padding: 15px; border-radius: 8px; }
        .controls { margin-bottom: 10px; display: flex; gap: 10px; align-items: center; }
        canvas { background: #111; border: 1px solid #555; }
        .strip { display: flex; gap: 4px; overflow-x: auto; margin-top: 10px; }
        .frame-thumb { width: 128px; height: 143px; border: 1px solid #444; position: relative; overflow: hidden; background: #222; }
        .frame-thumb img { position: absolute; }
    </style>
</head>
<body>
    <h1>순사 스프라이트 시트 4방향 실시간 보행 테스트</h1>
    <div id="test-containers"></div>

    <script>
        const img = new Image();
        img.src = 'assets/officer_spritesheet_centered.png';

        const rowNames = [
            "Row 0 (현재 Down - 정면)",
            "Row 1 (현재 Up - 뒷모습)",
            "Row 2 (현재 Right - 우측)",
            "Row 3 (현재 Left - 좌측)"
        ];

        img.onload = () => {
            const container = document.getElementById('test-containers');

            for (let r = 0; r < 4; r++) {
                const box = document.createElement('div');
                box.className = 'row-box';
                box.innerHTML = `
                    <h3>${rowNames[r]}</h3>
                    <div class="controls">
                        <canvas id="canvas-r${r}" width="128" height="143"></canvas>
                        <div>
                            <button onclick="toggleDirection(${r})">재생 순서 반전 (현재: 정방향 0->7)</button>
                            <span id="speed-label-${r}" style="margin-left: 10px;">프레임: 0</span>
                        </div>
                    </div>
                    <div class="strip" id="strip-${r}"></div>
                `;
                container.appendChild(box);

                const strip = document.getElementById('strip-' + r);
                for (let c = 0; c < 8; c++) {
                    const thumb = document.createElement('div');
                    thumb.className = 'frame-thumb';
                    thumb.innerHTML = `<img src="assets/officer_spritesheet.png" style="left: -${c * 128}px; top: -${r * 143}px;">`;
                    strip.appendChild(thumb);
                }
            }

            startAnimationLoop();
        };

        const reverseState = [false, false, false, false];
        window.toggleDirection = (r) => {
            reverseState[r] = !reverseState[r];
            event.target.innerText = reverseState[r] ? "재생 순서 반전 (현재: 역방향 7->0)" : "재생 순서 반전 (현재: 정방향 0->7)";
        };

        let currentFrame = 0;
        let timer = 0;

        function startAnimationLoop() {
            requestAnimationFrame(animate);
        }

        function animate() {
            timer++;
            if (timer >= 6) {
                timer = 0;
                currentFrame = (currentFrame + 1) % 8;
            }

            for (let r = 0; r < 4; r++) {
                const cvs = document.getElementById('canvas-r' + r);
                if (!cvs) continue;
                const ctx = cvs.getContext('2d');
                ctx.clearRect(0, 0, 128, 143);

                const col = reverseState[r] ? (7 - currentFrame) : currentFrame;
                document.getElementById('speed-label-' + r).innerText = `현재 프레임: ${col}번`;

                ctx.drawImage(img, col * 128, r * 143, 128, 143, 0, 0, 128, 143);
            }

            requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
